[project]
name = "itov"
version = "0.3.0"
description = "Local workspace and workflow preflight tools for ComfyUI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
itov = "itov.cli:main"

[build-system]
requires = ["uv_build>=0.9.5,<0.10"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=8,<9", "ruff>=0.9,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100
include = ["*.py", "*.pyi", "pyproject.toml"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
