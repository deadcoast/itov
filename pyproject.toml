[project]
name = "itov"
version = "0.13.1"
description = "Local ComfyUI catalogs, deterministic batches, and pinned image inference"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "comfyui-types>=1.4.1",
    "sourcery>=1.46.0",
]

[project.optional-dependencies]
# Dataset workers check for this exact Pillow version before decoding images.
dataset = ["Pillow==12.3.0"]

[project.scripts]
itov = "itov.cli:main"

[build-system]
requires = ["uv_build>=0.9.5,<0.10"]
build-backend = "uv_build"

[dependency-groups]
# uv installs this group by default for local development.
dev = [
    "pytest>=8,<9",
    "ruff>=0.9,<1",
    "Pillow==12.3.0",
    "mypy>=2.4.0",
    "pyright>=1.1.414",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100
include = ["*.py", "*.pyi", "pyproject.toml"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
